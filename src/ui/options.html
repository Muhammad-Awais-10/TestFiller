<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plover Filler Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <div class="extension-brand"><img class="extension-icon" src="../../assets/icon-48.png" alt=""><span>Plover Filler</span></div>
    <nav class="tabs" aria-label="Settings sections"><a href="#settings">Settings</a><a href="#history">History</a></nav>
    <section id="settingsPanel">
    <form id="settingsForm">
      <fieldset>
        <legend>Name</legend>
        <div class="field-grid">
          <label>Name prefix <input id="namePrefix" type="text" maxlength="30" placeholder="Dr."></label>
          <label>Name suffix <input id="nameSuffix" type="text" maxlength="30" placeholder="Jr."></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Email generation</legend>
        <div class="field-grid">
          <label>Alias prefix <input id="aliasPrefix" type="text" maxlength="63" placeholder="Uses department" aria-describedby="aliasHelp"></label>
          <label>Domain <input id="domain" type="text" inputmode="url" placeholder="example.com" aria-describedby="domainHelp"></label>
        </div>
        <p id="aliasHelp">The text before the number. Leave blank to use the default department.</p>
        <p id="domainHelp">The part after @. Leave blank to use example.com.</p>
        <div class="field-grid">
          <label>Default department <select id="department"></select></label>
          <label>Generation style <select id="mode"></select></label>
        </div>
        <div class="reset-counters"><button id="resetCounters" type="button">Reset counters</button></div>
      </fieldset>
      <fieldset>
        <legend>Other fields</legend>
        <div class="field-grid">
          <label>Company <input id="company" type="text" maxlength="100" placeholder="Example Company"></label>
          <label>Other prefix <input id="otherPrefix" type="text" maxlength="100"></label>
          <label>Other suffix <input id="otherSuffix" type="text" maxlength="100"></label>
        </div>
      </fieldset>
      <label>Country
        <div class="country-select">
          <button id="countryButton" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
          <div id="countryList" class="country-list" role="listbox" hidden><input id="countrySearch" type="search" placeholder="Search country or code" aria-label="Search countries"><div id="countryOptions"></div></div>
          <select id="defaultCountry" class="sr-only"></select>
        </div>
      </label>
      <label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>History entries (1–500) <input id="historyLimit" type="number" min="1" max="500"></label>
      <label class="check"><input id="autoCopy" type="checkbox"> Automatically copy each generated email</label>
      <button class="primary" type="submit">Save settings</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section id="historyPanel" hidden aria-labelledby="historyHeading">
      <h2 id="historyHeading">Email history</h2>
      <div class="history-toolbar"><label class="sr-only" for="search">Search history</label><input id="search" type="search" placeholder="Search email, department, or submission URL"><button id="historyExport" type="button">Export CSV</button><button id="historyClear" type="button" class="danger">Clear all</button></div>
      <p id="historySummary" role="status" aria-live="polite"></p>
      <ol id="history"></ol>
    </section>
  </main>
  <script src="../shared/constants.js"></script>
  <script src="../shared/generator.js"></script>
  <script src="options.js"></script>
</body>
</html>
