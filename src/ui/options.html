<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plover Filler Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header><a href="popup.html">Plover Filler</a><h1>Settings</h1></header>
    <form id="settingsForm">
      <label>Default country <input id="defaultCountry" type="text" minlength="2" maxlength="2" autocapitalize="characters" placeholder="US"></label>
      <label>Test email domain <input id="domain" type="text" inputmode="url" required aria-describedby="domainHelp"></label>
      <p id="domainHelp">Only the part after @. Defaults to webplover.com if invalid.</p>
      <label>Default department <select id="department"></select></label>
      <label>Generation style <select id="mode"></select></label>
      <label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>History entries (1–500) <input id="historyLimit" type="number" min="1" max="500"></label>
      <label class="check"><input id="autoCopy" type="checkbox"> Automatically copy each generated email</label>
      <button class="primary" type="submit">Save settings</button>
    </form>
    <section class="danger-zone" aria-labelledby="dataHeading">
      <h2 id="dataHeading">Local data</h2>
      <p>All data stays in this Chrome profile. Addresses are unique per department here while local storage is retained; other browsers or team members can generate the same sequence.</p>
      <div class="buttons"><button id="export" type="button">Export history CSV</button><button id="resetCounters" type="button">Reset counters</button><button id="clearHistory" type="button" class="danger">Clear history</button></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="../shared/constants.js"></script>
  <script src="../shared/generator.js"></script>
  <script src="options.js"></script>
</body>
</html>
